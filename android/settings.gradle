pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

rootProject.name = 'LpgCalculator'

def projectRoot = rootDir.parentFile
def expoPackagePath = ["node", "--print", "require.resolve('expo/package.json')"].execute(null, projectRoot).text.trim()
if (expoPackagePath && !expoPackagePath.isEmpty()) {
    apply from: new File(expoPackagePath, "../scripts/autolinking.gradle");
    useExpoModules()
} else {
    throw new GradleException("Could not find expo package. Make sure you run 'npm install' first.")
}

// Expo autolinking handles native modules, so we don't need React Native CLI autolinking

include ':app'

// Include React Native Gradle plugin (required for React Native 0.71+)
def gradlePluginPath = new File(projectRoot, "node_modules/@react-native/gradle-plugin")
if (gradlePluginPath.exists()) {
    includeBuild(gradlePluginPath)
} else {
    throw new GradleException("Could not find @react-native/gradle-plugin. Make sure you run 'npm install' first.")
}

// Include ReactAndroid if new architecture is enabled
if (settings.hasProperty("newArchEnabled") && settings.newArchEnabled == "true") {
    def reactNativePath = ["node", "--print", "require.resolve('react-native/package.json')"].execute(null, projectRoot).text.trim()
    if (reactNativePath && !reactNativePath.isEmpty()) {
        def reactNativeDir = new File(reactNativePath).getParentFile()
        include(":ReactAndroid")
        project(":ReactAndroid").projectDir = new File(reactNativeDir, "ReactAndroid");
    }
}


